<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ちびすけ禁煙カウンター</title>
    <!-- 共有したときの説明・ファビコン(🚭) -->
    <meta name="description" content="ちびすけの禁煙、応援中！">
    <meta property="og:title" content="ちびすけ禁煙カウンター">
    <meta property="og:description" content="ちびすけの禁煙、応援中！">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚭</text></svg>">
    <!-- Google Fonts から丸みのあるかわいいフォント「M PLUS Rounded 1c」を読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #ffffff;
            color: #333333;
            font-family: 'M PLUS Rounded 1c', "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN W4", "Comic Sans MS", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 960px; /* PC用に大きく拡張 */
        }
        /* 🚭 アイコン */
        .icon {
            font-size: 8rem; /* PC用にスケールアップ */
            line-height: 1;
            margin-bottom: 25px;
            display: block;
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.08));
        }
        /* 「ちびすけ 禁煙」テキスト */
        .title {
            font-size: 3rem; /* PC用にスケールアップ */
            font-weight: 800;
            color: #4a4a4a;
            letter-spacing: 0.15em;
            margin-bottom: 20px;
            padding-left: 0.15em;
        }
        /* 「ちびすけ」部分の色指定 (#1B365D) */
        .name-highlight {
            color: #1B365D;
        }
        /* 「〇日目」エリア */
        .day-wrapper {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 12px;
            margin-top: 10px;
        }
        /* 数字部分 */
        .day-number {
            font-size: 14rem; /* PC用に特大化 */
            font-weight: 900;
            color: #2b2b2b;
            line-height: 0.9;
            letter-spacing: -0.03em;
        }
        /* 「日目」部分 */
        .day-unit {
            font-size: 4rem; /* PC用にスケールアップ */
            font-weight: 800;
            color: #4a4a4a;
            letter-spacing: 0.05em;
        }
        /* 応援メッセージ */
        .message {
            margin-top: 40px;
            font-size: 1.8rem;
            font-weight: 800;
            color: #1B365D;
            line-height: 1.6;
            letter-spacing: 0.03em;
        }
        /* 画面幅が狭い場合の自動調整 */
        @media (max-width: 768px) {
            .icon { font-size: 5.5rem; }
            .title { font-size: 1.8rem; }
            .day-number { font-size: 7.5rem; }
            .day-unit { font-size: 2.2rem; }
            .message { font-size: 1.3rem; margin-top: 32px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚭</div>
        <div class="title"><span class="name-highlight">ちびすけ</span> 禁煙 <br>2nd Edition</div>
        <div class="day-wrapper">
            <span class="day-number" id="day-count">1</span>
            <span class="day-unit">日目</span>
        </div>
        <p class="message" id="message"></p>
    </div>
    <script>
        // ▼▼▼ 禁煙をはじめた日（1日目）をここで設定 ▼▼▼
        // 年を固定しておくと、年をまたいでもずっと数え続けます。
        const startDate = new Date("2026-09-22T00:00:00");
        // 日数に応じて変わる応援メッセージ（節目でお祝い）
        const milestones = [

{ day: 1,   msg: "ひょんなことから" },
{ day: 2,   msg: "街頭で" },
{ day: 3,   msg: "ストレスチェックを" },
{ day: 4,   msg: "受けた" },
{ day: 5,   msg: "ものの" },
{ day: 6,   msg: "その内容は" },

{ day: 9,   msg: "最初の" },
{ day: 10,   msg: "質問は、" },
{ day: 11,  msg: "「小腸で稲を育てていますか」" },
{ day: 12,  msg: "というもの" },
{ day: 13,  msg: "だった。" },

{ day: 14,  msg: "その次の" },
{ day: 15,  msg: "質問を" },
{ day: 16,  msg: "見ると、" },
{ day: 17,  msg: "「くしゃみをすると米粉が噴出しますか」" },
{ day: 18,  msg: "と書いて" },
{ day: 19,  msg: "あった。" },

{ day: 20,  msg: "ちびすけは" },
{ day: 21,  msg: "その2つの" },
{ day: 22,  msg: "質問に対して" },
{ day: 23,  msg: "「いいえ」" },
{ day: 24,  msg: "に丸を" },
{ day: 25,  msg: "つけようと" },
{ day: 26,  msg: "したが、" },

{ day: 27,  msg: "少し" },
{ day: 28,  msg: "考え直し、" },
{ day: 29,  msg: "「どちらともいえない」" },
{ day: 30,  msg: "に丸を" },
{ day: 31,  msg: "つけた。" },

{ day: 32,  msg: "その後の" },
{ day: 33,  msg: "質問は" },
{ day: 34,  msg: "ごく一般的な" },
{ day: 35,  msg: "内容" },
{ day: 36,  msg: "であったが、" },

{ day: 37,  msg: "最後の" },
{ day: 38,  msg: "質問に" },
{ day: 39,  msg: "「最近、腸から伸びた稲穂が、臓器の許容量を超えていませんか」" },
{ day: 40,  msg: "とあり、" },

{ day: 41,  msg: "ちびすけは" },
{ day: 42,  msg: "自分の" },
{ day: 43,  msg: "腹部を" },
{ day: 44,  msg: "そっと" },
{ day: 45,  msg: "撫でた。" },

{ day: 46,  msg: "すると、" },
{ day: 47,  msg: "腹の" },
{ day: 48,  msg: "奥から" },
{ day: 49,  msg: "ざわざわと" },
{ day: 50,  msg: "稲穂の" },
{ day: 51,  msg: "揺れる" },
{ day: 52,  msg: "音が" },
{ day: 53,  msg: "聞こえた。" },

{ day: 54,  msg: "しかし" },
{ day: 55,  msg: "気のせい" },
{ day: 56,  msg: "だろう" },
{ day: 57,  msg: "と考え、" },
{ day: 58,  msg: "この" },
{ day: 59,  msg: "質問には" },
{ day: 60,  msg: "「いいえ」" },
{ day: 61,  msg: "に丸を" },
{ day: 62,  msg: "付けた。" },
{ day: 63,  msg: "チェックシート" },

{ day: 67,  msg: "失い、" },
{ day: 68,  msg: "目を" },
{ day: 69,  msg: "覚ますと、" },
{ day: 70,  msg: "生命維持機能付き" },
{ day: 71,  msg: "ポッド" },
{ day: 72,  msg: "の中に" },
{ day: 73,  msg: "収容" },
{ day: 74,  msg: "されていた。" },
{ day: 75,  msg: "そして、" },
{ day: 76,  msg: "目の" },
{ day: 77,  msg: "前に" },
{ day: 78,  msg: "いた" },
{ day: 79,  msg: "白衣の" },

{ day: 81,  msg: "「お米は人を裏切りません」" },
{ day: 82,  msg: "と" },
{ day: 83,  msg: "言って、" },

{ day: 84,  msg: "日本一" },
{ day: 85,  msg: "長い" },
{ day: 86,  msg: "滑り台" },
{ day: 87,  msg: "「わくわくスライダー」" },
{ day: 88,  msg: "まで" },

{ day: 89,  msg: "ちびすけの" },
{ day: 90,  msg: "入った" },
{ day: 91,  msg: "ポッド" },
{ day: 92,  msg: "を" },
{ day: 93,  msg: "押し始めたのだ。" },

        ];
        function updateCounter() {
            const now = new Date();
            const diffMs = now - startDate;
            const countEl = document.getElementById('day-count');
            const msgEl = document.getElementById('message');
            if (diffMs < 0) {
                countEl.innerText = "0";
                msgEl.innerText = "";
                return;
            }
            // 8/1を1日目として日数計算
            const days = Math.floor(diffMs / (1000 * 60 * 60 * 24)) + 1;
            countEl.innerText = days;
            // その日までの断片をすべて連結して1つの文章にする
            let currentMsg = "";
            for (const m of milestones) {
                if (days >= m.day) {
                    currentMsg += m.msg;
                } else {
                    break;
                }
            }
            msgEl.innerText = currentMsg;
        }
        updateCounter();
        // ページを開いたままでも日付が変わったら自動更新（1分ごとにチェック）
        setInterval(updateCounter, 60 * 1000);
    </script>
</body>
</html>

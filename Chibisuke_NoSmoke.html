    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #ffffff;
            color: #333333;
            font-family: 'M PLUS Rounded 1c', "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN W4", "Comic Sans MS", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 960px; /* PC用に大きく拡張 */
        }
        /* 🚭 アイコン */
        .icon {
            font-size: 8rem; /* PC用にスケールアップ */
            line-height: 1;
            margin-bottom: 25px;
            display: block;
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.08));
        }
        /* 「ちびすけ 禁煙」テキスト */
        .title {
            font-size: 3rem; /* PC用にスケールアップ */
            font-weight: 800;
            color: #4a4a4a;
            letter-spacing: 0.15em;
            margin-bottom: 20px;
            padding-left: 0.15em;
        }
        /* 「ちびすけ」部分の色指定 (#1B365D) */
        .name-highlight {
            color: #1B365D;
        }
        /* 「〇日目」エリア */
        .day-wrapper {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 12px;
            margin-top: 10px;
        }
        /* 数字部分 */
        .day-number {
            font-size: 14rem; /* PC用に特大化 */
            font-weight: 900;
            color: #2b2b2b;
            line-height: 0.9;
            letter-spacing: -0.03em;
        }
        /* 「日目」部分 */
        .day-unit {
            font-size: 4rem; /* PC用にスケールアップ */
            font-weight: 800;
            color: #4a4a4a;
            letter-spacing: 0.05em;
        }
        /* 応援メッセージ */
        .message {
            margin-top: 40px;
            font-size: 1.8rem;
            font-weight: 800;
            color: #1B365D;
            line-height: 1.6;
            letter-spacing: 0.03em;
        }
        /* 画面幅が狭い場合の自動調整 */
        @media (max-width: 768px) {
            .icon { font-size: 5.5rem; }
            .title { font-size: 1.8rem; }
            .day-number { font-size: 7.5rem; }
            .day-unit { font-size: 2.2rem; }
            .message { font-size: 1.3rem; margin-top: 32px; }
        }
    </style>
</head>

        function updateCounter() {
            const now = new Date();
            const diffMs = now - startDate;
            const countEl = document.getElementById('day-count');
            const msgEl = document.getElementById('message');
            if (diffMs < 0) {
                countEl.innerText = "0";
                msgEl.innerText = "";
                return;
            }
            // 8/1を1日目として日数計算
            const days = Math.floor(diffMs / (1000 * 60 * 60 * 24)) + 1;
            countEl.innerText = days;
            // その日までの断片をすべて連結して1つの文章にする
            let currentMsg = "";
            for (const m of milestones) {
                if (days >= m.day) {
                    currentMsg += m.msg;
                } else {
                    break;
                }
            }
            msgEl.innerText = currentMsg;
        }
        updateCounter();
        // ページを開いたままでも日付が変わったら自動更新（1分ごとにチェック）
        setInterval(updateCounter, 60 * 1000);
